name: Build Windows exe

on:
  push:
    paths:
      - reprint_labels.py
      - .github/workflows/build-exe.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ReprintLabels reprint_labels.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReprintLabels-exe
          path: dist/ReprintLabels.exe
